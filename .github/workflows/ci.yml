name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: macos-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install ".[dev,numerical]"
      - run: python -m pytest -q
      - run: python scripts/installed_smoke.py

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install ".[dev,numerical,interop]"
      - run: python -m ruff check .
      - run: python -m pyright --pythonpath python
      - run: python -m pytest -q tests/test_adapters.py

  distributions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install build
      - run: python -m build
      - name: Install and exercise wheel without extras
        run: |
          python -m pip install dist/*.whl
          python scripts/installed_smoke.py
      - name: Install and exercise source distribution
        run: |
          python -m pip install --force-reinstall dist/*.tar.gz
          python scripts/installed_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
