name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor is what pyproject declares (requires-python = ">=3.11"); the ceiling is
        # what contributors are likely to be running. Both must stay green.
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Editable install rather than a bare `pip install -r`: it also proves the package
        # metadata and the src layout are buildable, which a PYTHONPATH-only run would not.
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest -q

      - name: Import without PYTHONPATH
        # Guards the packaging config specifically: `import causal_hypergraphs` must work
        # from an install, not only from a checkout with src/ on the path.
        run: cd "${{ runner.temp }}" && python -c "import causal_hypergraphs; print(causal_hypergraphs.__file__)"
