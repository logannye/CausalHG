[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causal-hypergraphs"
version = "0.1.0"
description = "Proof-carrying mechanism-level causal identification over typed hypergraphs."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.7",
  "pyright>=1.1",
]

[tool.pytest.ini_options]
testpaths = ["minimal_model", "tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["minimal_model"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
# src layout: resolve `causal_hypergraphs` from a checkout without requiring an install,
# matching the `pythonpath` pytest already uses.
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
