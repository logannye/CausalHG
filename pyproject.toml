[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "causal-hypergraphs"
version = "1.0.0"
description = "Causal inference and simulation for directed hypergraph mechanisms."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Core graph, identification, finite execution, and structural runtime use the standard library.
# Numerical and ecosystem integrations import their optional dependencies on use.
dependencies = []

[project.urls]
Homepage = "https://github.com/logannye/CausalHG"
Repository = "https://github.com/logannye/CausalHG"
Issues = "https://github.com/logannye/CausalHG/issues"

[tool.hatch.build.targets.wheel]
# Declared rather than inferred: the distribution name is `causal-hypergraphs` and the
# package lives under src/, so state the mapping instead of relying on backend heuristics.
packages = ["src/causal_hypergraphs"]

[project.optional-dependencies]
numerical = ["numpy>=1.24"]
interop = ["networkx>=3.2", "xgi>=0.10", "hypernetx>=2.4", "pandas>=2.1"]
dev = [
  "numpy>=1.24",
  "pytest>=8",
  "ruff>=0.7",
  "pyright>=1.1",
  "build>=1.2",
]

[tool.pytest.ini_options]
testpaths = ["minimal_model", "tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["minimal_model"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
# src layout: resolve `causal_hypergraphs` from a checkout without requiring an install,
# and the repo root so `tests.conformance` resolves. Mirrors the `pythonpath` pytest uses.
extraPaths = ["src", "."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
